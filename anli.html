.clist{display:grid;gap:10px}
.ccard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow-sm);transition:.22s;overflow:hidden}
.ccard:hover{box-shadow:var(--shadow)}
.cmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.ctag{background:linear-gradient(135deg,#c9a227,#dfb549);color:#3a2c05;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
.creg{font-size:11.5px;color:var(--sub);background:var(--soft);padding:2px 8px;border-radius:6px;font-weight:600}
.cyr{font-size:11.5px;color:var(--sub);background:#eef2f8;padding:2px 8px;border-radius:6px}
.cid{font-size:11.5px;color:var(--navy);font-family:ui-monospace,Menlo,monospace;background:var(--warm);padding:2px 8px;border-radius:6px;font-weight:600}
.ctitle{font-size:15px;color:var(--navy);font-weight:800;line-height:1.5;margin-bottom:5px}
.cgist{font-size:13px;color:var(--sub);line-height:1.7}

.court{font-size:11.5px;color:var(--sub)}
.court b{color:var(--navy)}
.ckey{font-size:12px;color:var(--blue);text-decoration:none;font-weight:600}
.ckey:hover{text-decoration:underline}
.empty{text-align:center;color:var(--sub);padding:26px 10px;font-size:13.5px;background:#fff;border:1px dashed var(--line);border-radius:var(--radius)}
.fbar{position:sticky;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;gap:8px;padding:9px 18px;margin-top:18px}

 gist:"涉及<b>连带共同保证的免责与追偿</b>。债权人未在保证期间内依法向保证人主张权利，保证人不再承担保证责任（保证期间届满免责）。",
 art:"articles/danbao-zeren.html",artn:"担保免责科普"},
{id:"（2017）粤03民终2559号",t:"连带共同保证人替别人还了钱，能追偿吗？",type:"保证担保",reg:"广东",court:"（《人民法院案例选》裁判规则）",yr:2017,kw:"保证 担保 追偿 连带",
 gist:"涉及<b>连带共同保证人之间的免责与追偿</b>，明确了共同保证情形下保证责任的划分与追偿路径。",
 art:"articles/danbao-zeren.html",artn:"担保免责科普"},

 art:"articles/lilv-yuexian.html",artn:"利率调减科普"},

 gist:"出租人未能证明租赁物真实存在、缺乏融物属性的，<b>按民间借贷认定</b>；同时也提示，若承租人自认部分租赁物真实、合同并非全然无融物属性，不宜简单否定融资租赁性质。",

 art:"articles/rongzi-zulin-jie-dai.html",artn:"名租实贷科普"},
{id:"(2025)皖1021刑初102号",t:"醉驾拘役1个月缓2个月，罚金2000——安徽缓刑参照",type:"刑事·危险驾驶",reg:"安徽",court:"安徽省怀远县人民法院",yr:2025,kw:"醉驾 危险驾驶 缓刑 拘役 安徽",
 gist:"程某危险驾驶案，判处<b>拘役1个月缓刑2个月、罚金2000元</b>，为安徽醉驾适用缓刑的<b>参照样本</b>。",
 art:"articles/zuijia-weixian.html",artn:"醉驾量刑科普"}
];
var TYPE=["婚约财产·彩礼","保证担保","融资租赁·名租实贷","刑事·危险驾驶"];
var REG=["安徽","北京","上海","浙江","广东","福建"];
function init(){
  var t=document.getElementById('fType'),r=document.getElementById('fReg');
  TYPE.forEach(function(x){var o=document.createElement('option');o.value=x;o.textContent=x;t.appendChild(o)});
  REG.forEach(function(x){var o=document.createElement('option');o.value=x;o.textContent=x+'省/市';r.appendChild(o)});
  render();
}
function matches(c){
  var t=document.getElementById('fType').value;
  var rg=document.getElementById('fReg').value;
  var id=(document.getElementById('fId').value||'').trim().toLowerCase();
  var kw=(document.getElementById('fKw').value||'').trim().toLowerCase();
  if(t&&c.type!==t)return false;
  if(rg&&c.reg!==rg)return false;
  if(id&&c.id.toLowerCase().indexOf(id)<0)return false;
  if(kw){
    var hay=(c.kw+' '+c.gist.replace(/[<b>\s]/g,'')).toLowerCase();
    if(hay.indexOf(kw)<0)return false;
  }
  return true;
}
function render(){
  var list=CASES.filter(matches);
  var el=document.getElementById('list');
  document.getElementById('cnt').innerHTML='共 <b>'+list.length+'</b> 条真实判例';
  document.getElementById('empty').style.display=list.length?'none':'block';
  el.innerHTML=list.map(function(c){
    return '<div class="ccard">'+
      '<div class="cmeta"><span class="ctag">'+c.type+'</span><span class="creg">'+c.reg+'</span><span class="cyr">'+c.yr+' 年</span><span class="cid">'+c.id+'</span></div>'+
      '<div class="ctitle">'+c.t+'</div>'+
      '<div class="cgist">'+c.gist+'</div>'+
      '<div class="cfoot"><span class="court">法院：<b>'+c.court+'</b></span><a class="ckey" href="'+c.art+'">看『'+c.artn+'』→</a></div>'+
      '</div>';
  }).join('');
}
function doSearch(){render()}
function doReset(){['fType','fReg','fId','fKw'].forEach(function(i){document.getElementById(i).value='';});render()}
document.addEventListener('DOMContentLoaded',init);
</script>
