var CASES=[
{id:"（2022）闽0128民初5080号",t:"未登记结婚，转给对方的20万算彩礼还是赠与？",type:"婚约财产·彩礼",reg:"福建",court:"福建平潭法院",yr:2022,kw:"彩礼 赠与 婚约 返还",
 gist:"男方为缔结婚姻分两笔各转10万元共20万元给女方，后未登记结婚。法院对比双方零散往来后认定<b>该20万元系彩礼而非恋爱赠与，判决全额返还</b>。",
 art:"articles/caili-fanhuan.html",artn:"彩礼全流程科普",
 full:"<h4>案情概要</h4><p>男方郑某为缔结婚姻，分两笔各转10万元、共20万元给女方，后双方未能登记结婚；双方便另有其他零散资金往来。</p><h4>争议焦点</h4><p>这20万元究竟是<b>彩礼</b>还是<b>恋爱期间的赠与</b>？能否要求返还？</p><h4>裁判要点</h4><p>法院对比双方其他零散资金往来后认定，该20万元系以缔结婚姻为目的给付的彩礼而非恋爱赠与，判决<b class='hl'>全额返还</b>。</p><h4>法律依据</h4><p>《民法典》第1042条禁止借婚姻索取财物；《最高人民法院关于审理涉彩礼纠纷案件适用法律若干问题的规定》明确，给付彩礼系以缔结婚姻为目的的附条件给付。</p><h4>给你一点提示</h4><p>彩礼能不能退、退多少，核心看<b>婚约有没有缔结成功、登记后有没有共同生活</b>，与谁先提分手无关。</p>"},
{id:"（2023）浙08民终445号",t:"借婚姻索取财物，索要的金饰礼金能要回吗？",type:"婚约财产·彩礼",reg:"浙江",court:"（人民法院案例库入库 2024-07-2-012-001）",yr:2023,kw:"婚姻 索取财物 彩礼 返还",fullurl:"anli_pages/2023-zhe08-445.html",
 gist:"一方反复以“结婚先决条件”索要财物却始终不能满足结婚要求。法院认定该行为属<b>借婚姻索取财物而非恋爱赠与，判决索取财物全部返还</b>。",
 art:"articles/caili-fanhuan.html",artn:"彩礼全流程科普",
 full:"<h4>案情概要</h4><p>涂某经人介绍与蒋某相识，蒋某自认识起便不断以「结婚先决条件」为由，先后索要金饰、压岁钱、改口费等财物，却始终不愿满足涂某提出的结婚要求。涂某诉请返还。</p><h4>争议焦点</h4><p>这些财物是<b>婚恋中的无偿赠与</b>，还是<b>借婚姻索取财物</b>？应否返还？</p><h4>裁判要点</h4><p>法院认定该行为属<b class='hl'>借婚姻索取财物而非恋爱赠与</b>，判决所索取财物<b class='hl'>全部返还</b>。</p><h4>法律依据</h4><p>《民法典》第1042条明确「禁止借婚姻索取财物」；最高人民法院涉彩礼纠纷司法解释。</p><h4>给你一点提示</h4><p>以「结婚」为名不断索要财物、却迟迟不落实结婚的，法律上倾向认定为借婚姻索取财物，可依法主张返还。</p>"},
{id:"（2016）浙03民终2086号",t:"担保人保证期间届满，还需要还钱吗？",type:"保证担保",reg:"浙江",court:"（《人民法院案例选》裁判规则）",yr:2016,kw:"保证 担保 保证期间 免责 追偿",
 gist:"涉及<b>连带共同保证的免责与追偿</b>。债权人未在保证期间内依法向保证人主张权利，保证人不再承担保证责任（保证期间届满免责）。",
 art:"articles/danbao-zeren.html",artn:"担保免责科普",
 full:"<h4>案由</h4><p>民间借贷纠纷中的<b>保证责任</b>争议。</p><h4>争议焦点</h4><p>保证人主张保证期间已经届满、可以不再承担保证责任，是否成立？其他共同保证人之间如何追偿？</p><h4>裁判要点</h4><p>债权人<b class='hl'>未在保证期间内依法向保证人主张权利</b>的，保证人不再承担保证责任（保证期间届满免责）；本案同时涉及连带共同保证人之间的<b class='hl'>免责与追偿</b>。</p><h4>法律依据</h4><p>《民法典》第692条（保证期间）、第693条（保证期间届满保证责任免除）、第686条（保证方式约定不明的按一般保证）；最高人民法院担保制度解释。</p><h4>给你一点提示</h4><p>担保不是「签个字就永远甩不掉」——受<b>保证期间</b>限制，债权人超期未主张可能免责。替人担保前务必看清「保证方式」和「保证期间」。</p>"},
{id:"（2017）粤03民终2559号",t:"连带共同保证人替别人还了钱，能追偿吗？",type:"保证担保",reg:"广东",court:"（《人民法院案例选》裁判规则）",yr:2017,kw:"保证 担保 追偿 连带",
 gist:"涉及<b>连带共同保证人之间的免责与追偿</b>，明确了共同保证情形下保证责任的划分与追偿路径。",
 art:"articles/danbao-zeren.html",artn:"担保免责科普",
 full:"<h4>案由</h4><p>连带共同保证中的<b>责任划分与追偿</b>争议。</p><h4>争议焦点</h4><p>多个保证人共同担保时，责任如何划分？其中一个保证人代偿后，能否、以及如何向其他保证人追偿？</p><h4>裁判要点</h4><p>明确<b class='hl'>连带共同保证情形下各保证人的责任划分与追偿路径</b>，避免债权人「随意找一方要钱」或某一保证人「白担保多担责」。</p><h4>法律依据</h4><p>《民法典》第686、692、693条；最高人民法院担保制度解释。</p><h4>给你一点提示</h4><p>多人共同担保时谁先承担、代偿后能不能找其他人分担，都有规则。签担保合同时写清「保证方式」「保证份额」很重要。</p>"},
{id:"（2020）沪0115民初4804号",t:"“名租实贷”的利息和违约金太高，超过法定红线了吗？",type:"融资租赁·名租实贷",reg:"上海",court:"（人民法院案例库入库案例）",yr:2020,kw:"融资租赁 利息 违约金 利率 调减 LPR",fullurl:"anli_pages/2021-hu74-87.html",
 gist:"“以租赁之身、借金融之名、行贷款之实”作负面评价。认定名为借贷后，<b>利息、违约金、或有租金合计限制在年利率24%以内（2020.8.20后按一年期LPR四倍）</b>，已收手续费在应付款中扣除。",
 art:"articles/lilv-yuexian.html",artn:"利率调减科普",
 full:"<h4>案由</h4><p>融资租赁合同纠纷（<b>名为融资租赁、实为借贷</b>）。</p><h4>争议焦点</h4><p>合同被认定为借款后，高额的利息、违约金、服务费等合计是否超出法定利率上限？已收费用如何处理？</p><h4>裁判要点</h4><p>对「以租赁之身、借金融之名、行贷款之实」作负面评价；认定名为借贷后，<b class='hl'>利息、违约金、或有租金等合计受利率上限约束</b>——2020年8月20日后按一年期LPR四倍，此前按年利率24%以内；<b class='hl'>已收手续费、服务费等应在应付款中扣除</b>。</p><h4>法律依据</h4><p>《民法典》第680条（禁止高利放贷）；最高人民法院《关于审理民间借贷案件适用法律问题的规定》第25条（利率上限）。</p><h4>给你一点提示</h4><p>若被「融资租赁」合同以高额租金、服务费、违约金垒高成本，可主张按<b>实际借款本金＋LPR四倍</b>计算，超过部分不还，且已扣费用应冲抵。</p>"},
{id:"（2021）沪74民终87号",t:"租赁物根本不存在，还是“融资租赁”吗？",type:"融资租赁·名租实贷",reg:"上海",court:"上海金融法院",yr:2021,kw:"融资租赁 租赁物 民间借贷 名租实贷",fullurl:"anli_pages/2021-hu74-87.html",
 gist:"出租人未能证明租赁物真实存在、缺乏融物属性的，<b>按民间借贷认定</b>；同时也提示，若承租人自认部分租赁物真实、合同并非全然无融物属性，不宜简单否定融资租赁性质。",
 art:"articles/rongzi-zulin-jie-dai.html",artn:"名租实贷科普",
 full:"<h4>案由</h4><p>融资租赁合同纠纷（人民法院案例库入库案例）。</p><h4>争议焦点</h4><p>租赁物根本不存在、或只是「账面走个形式」，合同究竟是<b>融资租赁</b>还是<b>借款</b>？</p><h4>裁判要点</h4><p>出租人<b class='hl'>未能证明租赁物真实存在、缺乏「融物」属性</b>的，按民间借贷认定；反之，若承租人自认部分租赁物真实、合同并非全然无融物属性，则不宜简单以举证不能否定融资租赁性质。</p><h4>法律依据</h4><p>《民法典》第735、737条；最高人民法院《关于审理融资租赁合同纠纷案件适用法律问题的解释》第1条。</p><h4>给你一点提示</h4><p>「售后回租」若没有<b>真实租赁物</b>（设备不存在／重复融资／低值高估），法律上可能被认定为借款——这直接决定你要不要按「本金＋LPR四倍」还钱，以及担保是否有效。</p>"},
{id:"（2021）京民终127号",t:"售后回租租赁物“低值高估”，还是融资租赁吗？",type:"融资租赁·名租实贷",reg:"北京",court:"北京市高级人民法院",yr:2021,kw:"融资租赁 售后回租 民间借贷 担保",
 gist:"售后回租模式下租赁物账面与评估价值<b>相差达十倍、明显“低值高估”</b>、租赁物未能起到担保作用，判定不符合融资租赁法律特征，<b>法律关系为民间借贷</b>。",
 art:"articles/rongzi-zulin-jie-dai.html",artn:"名租实贷科普",
 full:"<h4>案由</h4><p>售后回租型<b>融资租赁合同纠纷</b>。</p><h4>争议焦点</h4><p>租赁物「低值高估」、账面与真实价值严重不符，合同是融资租赁还是借贷？</p><h4>裁判要点</h4><p>售后回租模式下租赁物账面价值与评估价值<b class='hl'>相差达十倍、明显「低值高估」</b>、租赁物未能起到担保作用的，判定不符合融资租赁法律特征，<b class='hl'>双方实为借贷关系</b>。</p><h4>法律依据</h4><p>《民法典》第735条；最高人民法院融资租赁合同纠纷司法解释。</p><h4>给你一点提示</h4><p>租赁物<b>真实价值、是否实际转移所有权、能否起到担保作用</b>，是判断「是租赁还是借贷」的三大要点。</p>"},
{id:"（2019）浙09民终161号",t:"租赁物所有权始终没转移，还是“融资租赁”吗？",type:"融资租赁·名租实贷",reg:"浙江",court:"浙江省舟山市中级人民法院",yr:2019,kw:"融资租赁 所有权 民间借贷 抵押",
 gist:"售后回租中租赁物所有权<b>始终未转移、仅办理抵押</b>，双方未实际发生买卖再回租的事实，认定为<b>名为融资租赁、实为借贷</b>。",
 art:"articles/rongzi-zulin-jie-dai.html",artn:"名租实贷科普",
 full:"<h4>案由</h4><p>售后回租型融资租赁合同纠纷。</p><h4>争议焦点</h4><p>租赁物所有权始终没有真实转移、只是办了个抵押登记，能否成立融资租赁？</p><h4>裁判要点</h4><p>售后回租中租赁物所有权<b class='hl'>始终未转移、仅办理抵押登记</b>，双方未实际发生「先买卖再回租」，认定为<b class='hl'>名为融资租赁、实为民间借贷</b>。</p><h4>法律依据</h4><p>《民法典》第735、737条。</p><h4>给你一点提示</h4><p>只要「租赁物」从来没有真正卖给你、你也没真正买回来，只是办了个抵押做个形式，就可能被认定为借款，利息按借贷规则算。</p>"},
{id:"(2025)皖1021刑初102号",t:"醉驾拘役1个月缓2个月，罚金2000——安徽缓刑参照",type:"刑事·危险驾驶",reg:"安徽",court:"安徽省怀远县人民法院",yr:2025,kw:"醉驾 危险驾驶 缓刑 拘役 安徽",
 gist:"程某危险驾驶案，判处<b>拘役1个月缓刑2个月、罚金2000元</b>，为安徽醉驾适用缓刑的<b>参照样本</b>。",
 art:"articles/zuijia-weixian.html",artn:"醉驾量刑科普",
 full:"<h4>案由</h4><p><b>危险驾驶罪</b>。</p><h4>基本事实</h4><p>程某酒后驾驶机动车，血液酒精含量达到醉驾标准，涉嫌危险驾驶罪。</p><h4>裁判结果</h4><p>判处<b class='hl'>拘役1个月、缓刑2个月，罚金2000元</b>，为安徽醉驾适用缓刑的<b class='hl'>参照样本</b>。</p><h4>法律依据</h4><p>《刑法》第133条之一（危险驾驶罪）、第72条（缓刑）。</p><h4>给你一点提示</h4><p>血液酒精含量达<b>20～80mg/100ml</b>为饮酒驾驶（行政处罚），<b>≥80mg/100ml</b>为醉酒驾驶（刑事追责）。能否适用缓刑常以醉酒程度为参考（合肥约180mg/100ml为重要参考线），有事故或前科会更严。</p>"},

{id:"（2020）京民再84号",t:"单位没足额缴工伤保险，工伤待遇缩水能要单位补差额吗？",type:"工伤保险",reg:"北京",court:"（案例库入库 2024-07-2-014-003）",yr:2020,kw:"工伤 工伤保险 待遇 社保 差额 赔偿",
 gist:"用人单位<b>未足额缴纳工伤保险</b>，致劳动者经基金支付后的工伤保险待遇仍降低，单位应就<b class=\"hl\">待遇差额承担赔偿</b>。",
 art:"articles/gs-laodong-zhongcai.html",artn:"劳动仲裁全流程",
 full:"<h4>案由</h4><p>工伤保险待遇纠纷。</p><h4>争议焦点</h4><p>单位按低基数缴社保，导致劳动者工伤待遇降低，差额该由谁补足？</p><h4>裁判要点</h4><p>用人单位<b class=\"hl\">未按实际工资足额缴纳工伤保险</b>，其补缴滞纳金后工伤保险基金虽按规支付相应费用，但若能证明<b class=\"hl\">待遇仍然降低</b>，劳动者要求单位承担<b class=\"hl\">差额损失赔偿</b>的，人民法院应予支持。</p><h4>法律依据</h4><p>《社会保险法》第58、60、63条（单位应当足额缴纳社保）。</p><h4>给你一点提示</h4><p>单位缴费基数低于实际工资，会直接压低停工留薪期工资、一次性伤残补助金等待遇。<b>保留工资条、社保记录</b>，可主张单位补足待遇差额。</p>"},
{id:"（2017）豫08民再31号",t:"工亡家属已拿到肇事方赔偿，单位工伤待遇还赔吗？",type:"工伤保险",reg:"河南",court:"（案例库入库 2023-16-2-490-003）",yr:2017,kw:"工伤 工亡 交通事故 侵权 双赔 赔偿",
 gist:"劳动者因交通事故工亡，产生<b>第三人侵权与工伤保险竞合</b>。家属已获侵权赔偿的，<b class=\"hl\">不应从工伤保险赔付中扣除</b>，可分别主张。",
 art:"articles/gs_money.html",artn:"工伤赔偿怎么算",
 full:"<h4>案由</h4><p>工伤保险待遇纠纷（工亡）。</p><h4>争议焦点</h4><p>家属已拿到肇事方侵权赔偿，单位还应支付工伤保险待遇吗？能否把已获赔款扣除？</p><h4>裁判要点</h4><p>发生<b class=\"hl\">第三人侵权与工伤保险责任竞合</b>时，受害人亲属有权分别起诉——既向侵权人主张民事赔偿，也向单位主张工伤保险待遇；<b class=\"hl\">已获得的侵权赔偿不应从工伤保险赔款中扣除</b>。</p><h4>法律依据</h4><p>《民法典》第1179条（人身损害赔偿）；《工伤保险条例》第39条（工亡待遇）。</p><h4>给你一点提示</h4><p>上下班途中发生非本人主要责任的交通事故，受伤或死亡可「<b>双赔</b>」（侵权＋工伤）。<b>务必保留医疗票据、事故认定书</b>，避免遗漏一方主张。</p>"},
{id:"（2022）京03民终9602号",t:"下班后微信群回消息到半夜，算加班、能要加班费吗？",type:"劳动争议",reg:"北京",court:"（案例库入库 2024-18-2-490-002）",yr:2022,kw:"加班 加班费 隐形加班 微信 劳动",
 gist:"单位安排劳动者在<b>非工作时间、工作场所以外</b>用微信等处理工作（“隐形加班”），付出<b>实质劳动且明显占用休息时间</b>的，应<b class=\"hl\">支付加班费</b>；时长难以量化时按证据酌定。",
 art:"articles/gs-laodong-zhongcai.html",artn:"劳动仲裁全流程",
 full:"<h4>案由</h4><p>劳动争议（加班费）。</p><h4>争议焦点</h4><p>下班后在家用微信群、邮件处理工作的「隐形加班」，算加班吗？加班费怎么算？</p><h4>裁判要点</h4><p>单位安排劳动者在<b class=\"hl\">非工作时间、工作场所以外利用社交媒体等开展实质工作</b>、明显占用休息时间并能举证证明的，<b class=\"hl\">应当支付加班费</b>；因时长工作量难以客观量化，法院按加班频率、工作内容、在线时长等<b class=\"hl\">酌定加班费数额</b>。</p><h4>法律依据</h4><p>《劳动法》第44条（加班费）；最高人民法院相关裁判规则。</p><h4>给你一点提示</h4><p>下班后不断被拉群、半夜安排任务，<b>保留微信/邮件记录</b>是关键证据，是主张「隐形加班费」的基础。</p>"},
{id:"（2020）赣民再2号",t:"招了超龄没社保的大爷，是劳动关系还是劳务？",type:"劳动争议",reg:"江西",court:"（案例库入库 2024-16-2-186-001）",yr:2020,kw:"退休 超龄 劳务关系 劳动关系 社保",
 gist:"招用<b>已达法定退休年龄、未享受基本养老保险待遇</b>且此前也无劳动关系的人员，双方通常构成<b class=\"hl\">劳务关系而非劳动关系</b>。",
 art:"articles/gs-laodong-zhongcai.html",artn:"劳动仲裁全流程",
 full:"<h4>案由</h4><p>劳动合同纠纷（劳务承包关系认定）。</p><h4>争议焦点</h4><p>用人单位招用已达退休年龄、未享养老金且此前无劳动关系的人员，双方是劳动关系还是劳务关系？</p><h4>裁判要点</h4><p>若人员<b class=\"hl\">已达法定退休年龄、未享受基本养老保险待遇</b>，且此前与单位无劳动关系，其签订的劳务/承包用工通常认定为<b class=\"hl\">劳务关系而非劳动关系</b>，不适用劳动法及工伤待遇的强制条款。</p><h4>法律依据</h4><p>《劳动合同法实施条例》第21条（达到退休年龄劳动合同终止）。</p><h4>给你一点提示</h4><p>超龄用工难以走劳动仲裁和工伤认定，属劳务关系。<b>签劳务/承揽合同，并购买雇主责任险等商业险</b>更稳妥。</p>"},
{id:"（2022）闽01民终1168号",t:"签了两次固定期限合同，能单方要求签无固定期限合同吗？",type:"劳动争议",reg:"福建",court:"（案例库入库 2024-07-2-186-003）",yr:2022,kw:"无固定期限劳动合同 续订 劳动",
 gist:"符合《劳动合同法》续订无固定期限劳动合同条件的劳动者，<b>享有单方选择权</b>，用人单位<b class=\"hl\">无权拒绝续订</b>。",
 art:"articles/gs-laodong-zhongcai.html",artn:"劳动仲裁全流程",
 full:"<h4>案由</h4><p>劳动合同纠纷（无固定期限劳动合同）。</p><h4>争议焦点</h4><p>连续订立二次固定期限合同后再续订，或连续工作满十年，劳动者能否单方要求签订无固定期限劳动合同？</p><h4>裁判要点</h4><p>符合法定条件的劳动者<b class=\"hl\">对是否订立无固定期限劳动合同享有单方选择权</b>，用人单位无权拒绝；单位以劳动者不配合或自身原因拒绝续订的，法律不予支持。</p><h4>法律依据</h4><p>《劳动合同法》第14条（无固定期限劳动合同的订立情形）。</p><h4>给你一点提示</h4><p>连续两次签固定期限合同后再续订、或连续工作满十年，可主张签无固定期限合同，<b>别被单位用一年一签糊弄过去</b>。</p>"},
{id:"（2019）沪74民终439号",t:"车被融资公司偷偷拖走贱卖，欠多少能由它说了算？",type:"融资租赁·纠纷",reg:"上海",court:"（案例库入库 2024-08-2-112-004）",yr:2019,kw:"融资租赁 收车 处置 评估 损失",
 gist:"出租人<b>自行收回并处置租赁物</b>的，应遵循公平原则并证明处置价<b>合理</b>；未经评估又无其他证据证明处置价符合市场价的，<b class=\"hl\">不以其处置价认定损失</b>。",
 art:"articles/rongzi-zulin-jie-dai.html",artn:"融资租赁科普",
 full:"<h4>案由</h4><p>融资租赁合同纠纷。</p><h4>争议焦点</h4><p>汽车/设备被融资公司自行收回并处置后，欠款损失该怎么算？是否直接采信其处置价？</p><h4>裁判要点</h4><p>出租人自行收回处置租赁物的，<b class=\"hl\">应遵循公平原则并充分举证处置价合理</b>；未经有资质机构评估、又无其他证据证明处置价符合市场价格的，<b class=\"hl\">不以其处置价认定出租人损失</b>。</p><h4>法律依据</h4><p>《民法典》第745、752条（融资租赁）。</p><h4>给你一点提示</h4><p>车/设备被融资公司私自拖走低价贱卖，可要求其<b>举证处置价合理、按市场公允价值结算</b>，避免被多扣、倒欠。</p>"},
{id:"（2013）黄浦民五（商）初字第6265号",t:"售后回租车没真卖给你，出租人凭“占有改定”就能取得所有权？",type:"融资租赁·纠纷",reg:"上海",court:"（案例库入库 2024-08-2-112-002）",yr:2013,kw:"融资租赁 售后回租 占有改定 善意取得 所有权",
 gist:"售后回租中，承租人<b>未先取得租赁物所有权</b>时，出租人即便善意，也<b class=\"hl\">因占有改定不构成交付而无法善意取得</b>租赁物。",
 art:"articles/rongzi-zulin-jie-dai.html",artn:"融资租赁科普",
 full:"<h4>案由</h4><p>融资租赁合同纠纷（售后回租·善意取得）。</p><h4>争议焦点</h4><p>售后回租里，出租人能否仅凭「占有改定」善意取得租赁物所有权？</p><h4>裁判要点</h4><p>售后回租中租赁物占有使用状态未实际改变，<b class=\"hl\">占有改定公示不足，不构成善意取得的「交付」要件</b>；承租人未完全取得设备所有权时，即使出租人主观善意，<b class=\"hl\">也不能善意取得租赁物所有权</b>。</p><h4>法律依据</h4><p>《民法典》第311条（善意取得）；融资租赁合同纠纷司法解释。</p><h4>给你一点提示</h4><p>「售后回租」若无真实所有权转移，出租人不能仅凭合同＋登记就取得所有权，这是识别「名租实贷」的重要线索。</p>"},
{id:"（2021）沪0115民初34155号",t:"几个担保人，一个替公司还了钱，能找其他人分担吗？",type:"融资租赁·纠纷",reg:"上海",court:"（案例库入库 2024-08-2-143-002）",yr:2021,kw:"融资租赁 保证 担保 追偿 代偿",
 gist:"债权有两个以上第三人担保，<b>部分担保人代偿并受让债权</b>的，属承担保证责任，<b class=\"hl\">无特别约定时不能向其他担保人追偿</b>。",
 art:"articles/danbao-zeren.html",artn:"担保免责科普",
 full:"<h4>案由</h4><p>追偿权纠纷（融资租赁债权担保竞合）。</p><h4>争议焦点</h4><p>同一笔债务有几个担保人，其中一个替公司还了款并受让债权，能否向其他担保人追偿？</p><h4>裁判要点</h4><p>债权有多个第三人担保，<b class=\"hl\">部分担保人代偿并受让债权的，属于承担保证责任的行为</b>；在没有特别约定或非法定情形下，<b class=\"hl\">不能向其他担保人追偿</b>。</p><h4>法律依据</h4><p>《民法典》第524条（代为履行）、第700条（担保人追偿）。</p><h4>给你一点提示</h4><p>替人做融资租赁担保前先想清楚——<b>真要自己先还了款，能不能找其他担保人分担</b>，最好事先写清分担约定。</p>"},
{id:"（2022）豫04民终1631号",t:"没领证但一起过了几年还生了娃，彩礼还要还吗？",type:"婚约财产·彩礼",reg:"河南",court:"（案例库入库 2023-07-2-012-002）",yr:2022,kw:"彩礼 返还 共同生活 子女 婚姻",
 gist:"未办结婚登记，但<b>按习俗办婚礼、共同生活三年余并生育子女</b>的，<b class=\"hl\">一般不支持返还彩礼</b>，以平衡双方利益。",
 art:"articles/caili-fanhuan.html",artn:"彩礼返还科普",
 full:"<h4>案由</h4><p>婚约财产纠纷（彩礼返还）。</p><h4>争议焦点</h4><p>没领结婚证，但一起生活较长时间还育有子女，分手后彩礼要不要返还？</p><h4>裁判要点</h4><p>关于「未办理结婚登记应返还彩礼」的规定<b class=\"hl\">限于双方未共同生活的情形</b>；本案双方按习俗举办婚礼、共同生活三年余并生育一子，法院<b class=\"hl\">驳回返还彩礼的请求</b>，以平衡各方利益、保护妇女儿童权益。</p><h4>法律依据</h4><p>《民法典婚姻家庭编解释（一）》第5条；涉彩礼纠纷司法解释。</p><h4>给你一点提示</h4><p>彩礼能否返还≠「没领证就全退」——<b>是否共同生活、有无子女</b>才是关键，别信「没领证全额退」的片面说法。</p>"},
{id:"（2024）川1802民初3553号",t:"对象隐瞒重大疾病（如艾滋病）结婚，能撤销婚姻吗？",type:"婚姻家庭",reg:"四川",court:"（案例库入库 2024-07-2-018-001）",yr:2024,kw:"婚姻 撤销 重大疾病 隐瞒 婚检",
 gist:"夫妻一方<b>患有影响结婚生育的重大疾病（如艾滋病）但婚前未如实告知</b>，另一方自知道或应当知道撤销事由之日起<b class=\"hl\">一年内</b>可请求撤销婚姻。",
 art:"articles/hun-yin-lijing.html",artn:"离婚·婚姻科普",
 full:"<h4>案由</h4><p>撤销婚姻纠纷。</p><h4>争议焦点</h4><p>配偶婚前隐瞒重大疾病（如艾滋病）才结婚的，受害方能否撤销婚姻？有没有时间限制？</p><h4>裁判要点</h4><p>一方<b class=\"hl\">患有影响结婚生育的重大疾病但婚前未如实告知</b>的，另一方自知道或应当知道撤销事由之日起<b class=\"hl\">一年内</b>可请求撤销婚姻，人民法院应予支持。</p><h4>法律依据</h4><p>《民法典》第1053条（重大疾病未告知可请求撤销）、第1054条（无效或被撤销婚姻的后果）。</p><h4>给你一点提示</h4><p>婚前隐瞒重大疾病，受害方可主张<b>撤销婚姻而非离婚</b>（法律后果不同）；注意<b>一年的除斥期</b>，超过了就不能再撤销——婚检很重要。</p>"}

];
var TYPE=["婚约财产·彩礼","婚姻家庭","工伤保险","劳动争议","融资租赁·名租实贷","融资租赁·纠纷","保证担保","刑事·危险驾驶"];
var REG=["安徽","北京","上海","浙江","广东","福建","河南","江西","四川"];
function init(){
  var t=document.getElementById('fType'),r=document.getElementById('fReg');
  TYPE.forEach(function(x){var o=document.createElement('option');o.value=x;o.textContent=x;t.appendChild(o)});
  REG.forEach(function(x){var o=document.createElement('option');o.value=x;o.textContent=x+'省/市';r.appendChild(o)});
  render();
}
function matches(c){
  var t=document.getElementById('fType').value;
  var rg=document.getElementById('fReg').value;
  var id=(document.getElementById('fId').value||'').trim().toLowerCase();
  var kw=(document.getElementById('fKw').value||'').trim().toLowerCase();
  if(t&&c.type!==t)return false;
  if(rg&&c.reg!==rg)return false;
  if(id&&c.id.toLowerCase().indexOf(id)<0)return false;
  if(kw){
    var hay=(c.kw+' '+c.gist.replace(/<[^>]+>/g,'')+' '+(c.full||'').replace(/<[^>]+>/g,'')).toLowerCase();
    if(hay.indexOf(kw)<0)return false;
  }
  return true;
}
function render(){
  var list=CASES.filter(matches);
  document.getElementById('cnt').innerHTML='共 <b>'+list.length+'</b> 条真实判例';
  document.getElementById('empty').style.display=list.length?'none':'block';
  document.getElementById('list').innerHTML=list.map(function(c){
    return '<div class="ccard">'+
      '<div class="cmeta"><span class="ctag">'+c.type+'</span><span class="creg">'+c.reg+'</span><span class="cyr">'+c.yr+' 年</span><span class="cid">'+c.id+'</span></div>'+
      '<div class="ctitle">'+c.t+'</div>'+
      '<div class="cgist">'+c.gist+'</div>'+
      '<div class="cfoot"><span class="court">法院：<b>'+c.court+'</b></span><a class="ckey" href="'+c.art+'">看『'+c.artn+'』→</a></div>'+'\n'+
      (c.fullurl?'<a class="ckey-full" href="'+c.fullurl+'">📄 查看判决书全文 →</a>':'')+'\n'+
      '<button class="cfull-btn" onclick="toggleFull(this)">📖 展开判例全文 ▾</button>'+'\n'+
      '<div class="cfull" style="display:none">'+c.full+'</div>'+'\n'+
      '</div>';
  }).join('');
}
function toggleFull(btn){
  var d=btn.nextElementSibling;
  var open=d.style.display==='block';
  d.style.display=open?'none':'block';
  btn.innerHTML=open?'📖 展开判例全文 ▾':'📕 收起全文 ▴';
  if(!open){setTimeout(function(){d.scrollIntoView({block:'nearest',behavior:'smooth'})},60)}
}
function doSearch(){render()}
function doReset(){['fType','fReg','fId','fKw'].forEach(function(i){document.getElementById(i).value='';});render()}
document.addEventListener('DOMContentLoaded',init);
</script>
